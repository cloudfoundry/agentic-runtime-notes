    - research/azure-hosted-agents.md

- id: attested-workload-authority
  title: Attested Workload Authority and Mediated Tool Access
  proposition: Exchange platform-attested workload identity for scoped authority while credentials and outbound tool access remain mediated by the platform.
  cf_gap: CF issues workload identity certificates but does not exchange them for scoped tool authority, keep third-party credentials out of workloads, mediate off-platform access, or record delegation-aware audit events.
  strategic_decision: Decide whether CF should become the portable trust and policy layer between agent workloads and the tools they invoke.
  poc: Exchange a Diego instance identity certificate for a short-lived scoped token, invoke one allowed tool through a credential proxy and egress mediator, deny another, and emit attributable audit events.
  rfc_scope: Define workload token exchange, authority and delegation claims, credential brokering, outbound mediation and policy enforcement, audit events, revocation, and integration boundaries for UAA, routing, and service brokers.
  core:
