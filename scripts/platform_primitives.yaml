- id: durable-addressable-execution
  title: Durable, Addressable Execution
  proposition: Keep logical execution durable and addressable while compute remains replaceable.
  cf_gap: CF tasks are tied to one compute attempt and lack stable execution identity, checkpoints, suspend/resume, durable events, timers, and retry policy.
  strategic_decision: Decide whether CF should provide a durable execution lifecycle that frameworks and bound state services can build on.
  poc: Run a checkpointing task under a stable execution ID, suspend it after persisting state, then resume it on replacement compute through events, timers, and bounded retries.
  rfc_scope: Define execution identity, lifecycle states, checkpoint handoff, event and timer delivery, retry semantics, observability, and the boundary between CF lifecycle ownership and bound state stores.
  core:
    - ideas/durable-tasks-for-cf.md
    - ideas/dapr-durable-execution-on-cf.md
    - ideas/agent-failure-checkpointing.md
