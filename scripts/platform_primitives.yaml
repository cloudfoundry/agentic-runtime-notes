- id: session-scoped-isolated-execution
  title: Session-Scoped Isolated Execution
  proposition: Create resumable, session-scoped execution from reusable staged environments, mutable workspaces, selectable isolation, and controlled networking.
  cf_gap: CF can stage apps and run ephemeral tasks but cannot cheaply compose a reusable environment with per-session workspace state, select stronger isolation, constrain session networking, or resume the session lifecycle.
  strategic_decision: Decide whether CF should expose session execution as a composition of existing package, build, droplet, task, volume, networking, and isolation capabilities.
  poc: Start two isolated sessions from one content-addressed staged environment, attach separate mutable workspaces, apply per-session egress policy, stop one session, and resume it on fresh compute.
  rfc_scope: Define environment and workspace references, session identity and lifecycle, isolation classes, network policy, workspace persistence and cleanup, scheduling, quotas, and compatibility with existing CF staging and task APIs.
