<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="'Avenir Next','Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="aNavy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1b3b51"/>
    </marker>
  </defs>

  <!-- LLM: a bound service -->
  <rect x="450" y="10" width="420" height="84" rx="10" fill="#e9f6fb" stroke="#0c9ed5" stroke-width="2.5"/>
  <text x="660" y="43" text-anchor="middle" fill="#1b3b51" font-size="27" font-weight="700">LLM</text>
  <text x="660" y="71" text-anchor="middle" fill="#325a6f" font-size="15">a bound service · credentials from the platform</text>

  <!-- agent <-> LLM -->
  <line x1="565" y1="174" x2="565" y2="100" stroke="#1b3b51" stroke-width="2.5" marker-end="url(#aNavy)"/>
  <line x1="755" y1="100" x2="755" y2="174" stroke="#1b3b51" stroke-width="2.5" marker-end="url(#aNavy)"/>
  <text x="553" y="141" text-anchor="end"   fill="#325a6f" font-size="15">prompt + tool definitions</text>
  <text x="767" y="141" text-anchor="start" fill="#325a6f" font-size="15">response asks for a tool call</text>

  <!-- session storage: an emerging binding -->
  <text x="150" y="170" text-anchor="middle" fill="#6b8a99" font-size="12" font-weight="700" letter-spacing="1.2">EMERGING PATTERN</text>
  <rect x="20" y="180" width="260" height="110" rx="10" fill="#e9f6fb" stroke="#0c9ed5" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="150" y="208" text-anchor="middle" fill="#1b3b51" font-size="21" font-weight="700">Session storage</text>
  <text x="150" y="234" text-anchor="middle" fill="#3a3a3a" font-size="14">history · checkpoints · resume</text>
  <text x="150" y="260" text-anchor="middle" fill="#0c9ed5" font-size="14" font-weight="600">a bound database</text>

  <!-- agent <-> session storage -->
  <line x1="286" y1="235" x2="364" y2="235" stroke="#1b3b51" stroke-width="2.5" marker-start="url(#aNavy)" marker-end="url(#aNavy)"/>
  <text x="325" y="222" text-anchor="middle" fill="#325a6f" font-size="13">state</text>

  <!-- the loop itself -->
  <rect x="370" y="174" width="580" height="122" rx="12" fill="#ffffff" stroke="#1b3b51" stroke-width="3"/>
  <text x="660" y="218" text-anchor="middle" fill="#1b3b51" font-size="30" font-weight="700">Agent loop</text>
  <text x="660" y="249" text-anchor="middle" fill="#325a6f" font-size="16">build prompt → read response → execute tool → repeat</text>
  <text x="660" y="273" text-anchor="middle" fill="#0c9ed5" font-size="14" font-weight="600">one ordinary process on Cloud Foundry</text>

  <!-- agent <-> tools -->
  <line x1="490" y1="300" x2="490" y2="326" stroke="#1b3b51" stroke-width="2.5" marker-start="url(#aNavy)" marker-end="url(#aNavy)"/>
  <line x1="930" y1="300" x2="930" y2="326" stroke="#1b3b51" stroke-width="2.5" marker-start="url(#aNavy)" marker-end="url(#aNavy)"/>

  <!-- remote tools -->
  <rect x="300" y="330" width="380" height="115" rx="10" fill="#e9f6fb" stroke="#0c9ed5" stroke-width="2.5"/>
  <text x="490" y="365" text-anchor="middle" fill="#09749b" font-size="23" font-weight="700">Remote tools</text>
  <text x="490" y="393" text-anchor="middle" fill="#3a3a3a" font-size="16">MCP over HTTP · service APIs</text>
  <text x="490" y="422" text-anchor="middle" fill="#0c9ed5" font-size="15" font-weight="600">just another bound service</text>

  <!-- local tools -->
  <rect x="740" y="330" width="380" height="115" rx="10" fill="#fff7e0" stroke="#ffc82b" stroke-width="2.5"/>
  <text x="930" y="365" text-anchor="middle" fill="#806614" font-size="23" font-weight="700">Local tools</text>
  <text x="930" y="393" text-anchor="middle" fill="#3a3a3a" font-size="16">shell · files · generated code · browser</text>
  <text x="930" y="422" text-anchor="middle" fill="#806614" font-size="15" font-weight="600">no platform primitive yet</text>
</svg>
