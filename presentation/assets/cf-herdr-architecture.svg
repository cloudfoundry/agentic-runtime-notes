<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 105 1500 765" width="1500" height="765" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">CF Herdr architecture</title>
  <desc id="arch-desc">Clients, ingress, and the application layer: a CF Herdr manager app and an agent sandbox app running Herdr with OpenCode and shell processes, alongside the CF API and Diego.</desc>

  <defs>
    <marker id="wide-arrow" markerWidth="28" markerHeight="28" refX="14" refY="14" markerUnits="userSpaceOnUse" orient="auto">
      <circle cx="14" cy="14" r="14" fill="#bcdcec"/>
    </marker>
    <filter id="soft-shadow"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity=".14"/></filter>
  </defs>

  <style>
    svg { font-family: 'Avenir Next','Segoe UI',Helvetica,Arial,sans-serif; }

    /* layer bands */
    .table-row { stroke:#cfe4ee; stroke-width:1; }
    .row-a { fill:#f7fbfd; }
    .row-b { fill:#eef7fb; }
    .row-label { fill:#6b8a99; font-size:13px; font-weight:850; letter-spacing:.13em; }

    /* nodes */
    .node rect { fill:#ffffff; stroke-width:3; filter:url(#soft-shadow); }
    .node-title { fill:#1b3b51; font-size:21px; font-weight:750; }
    .node-copy { fill:#325a6f; font-size:16px; }
    .client-node rect { fill:#e9f6fb; stroke:#40b7eb; }
    .cf-node rect { stroke:#0c9ed5; }
    .poc-node rect { stroke:#ffc82b; }

    /* app containers */
    .app-container > rect { fill:#ffffff; stroke:#ffc82b; stroke-width:3; }
    .app-container.gray-style > rect { fill:#fbfdfe; stroke:#9db6c4; stroke-width:3; }
    .app-title { fill:#09749b; font-size:13px; font-weight:850; letter-spacing:.13em; }

    /* components */
    .process.purple-style rect { fill:#eef3f7; stroke:#8aa6b8; stroke-width:1.5; }
    .component rect { fill:#ffffff; stroke:#a8c4d3; stroke-width:1.5; }
    .sandbox-style rect { fill:#fff7e0; stroke:#ffc82b; stroke-width:3; }
    .component-title { fill:#1b3b51; font-size:18px; font-weight:750; text-anchor:middle; }
    .component-copy { fill:#325a6f; font-size:15px; text-anchor:middle; }

    /* herdr runtime */
    .herdr-title { fill:#1b3b51; font-size:22px; font-weight:850; letter-spacing:.04em; }
    .process-link { fill:none; stroke:#8aa6b8; stroke-width:2; }
    .process rect { fill:#eef3f7; stroke:#8aa6b8; stroke-width:1.5; }
    .process text { fill:#1b3b51; font-size:14px; font-weight:700; }

    /* cf system */
    .cf-system-component { fill:#e9f6fb; stroke:#0c9ed5; stroke-width:2.5; }
    /* beat `.node rect` (0,1,1), which would otherwise force CF API white */
    .node rect.cf-system-component { fill:#e9f6fb; }
    .system-title { fill:#1b3b51; font-size:19px; font-weight:800; }

    /* routes */
    .wide-route { fill:none; stroke:#bcdcec; stroke-width:14; stroke-linejoin:round; stroke-linecap:butt; }
    .route-endpoint { fill:#bcdcec; }
  </style>

  <g aria-hidden="true">
    <rect class="table-row row-a" x="70" y="125" width="1460" height="115" rx="14"/>
    <rect class="table-row row-b" x="70" y="250" width="1460" height="105" rx="14"/>
    <rect class="table-row row-a" x="70" y="365" width="1460" height="485" rx="14"/>
    <text class="row-label" text-anchor="middle" transform="translate(94 182) rotate(-90)">CLIENTS</text>
    <text class="row-label" text-anchor="middle" transform="translate(94 302) rotate(-90)">INGRESS</text>
    <text class="row-label" text-anchor="middle" transform="translate(94 598) rotate(-90)">APPLICATIONS + CONTROL PLANE</text>
  </g>

  <g id="clients-layer">
    <g class="node client-node">
      <rect x="120" y="145" width="300" height="72" rx="14"/>
      <text class="node-title" x="150" y="180">Developer Browser</text>
      <text class="node-copy" x="150" y="204">Observe · prompt · review</text>
    </g>
    <g class="node client-node">
      <rect x="1205" y="145" width="300" height="72" rx="14"/>
      <text class="node-title" x="1235" y="180">Developer Terminal</text>
      <text class="node-copy" x="1235" y="204">cf ssh · Herdr</text>
    </g>
  </g>

  <g id="apps-layer">
    <g id="manager-app" class="app-container gray-style node poc-node">
      <rect x="330" y="390" width="430" height="350" rx="20"/>
      <text class="app-title" x="545" y="722" text-anchor="middle">APP · CF HERDR MANAGER</text>
      <g id="manager-api-core" class="component sandbox-style">
        <rect x="360" y="445" width="175" height="235" rx="14"/>
        <text class="component-title" x="447.5" y="555">Manager API</text>
        <text class="component-copy" x="447.5" y="580">+ reconciler</text>
      </g>
      <g class="component sandbox-style">
        <rect x="555" y="445" width="175" height="235" rx="14"/>
        <text class="component-title" x="642.5" y="568">Lead Collie</text>
      </g>
    </g>

    <g id="sandbox-app" class="app-container gray-style">
      <rect x="790" y="390" width="715" height="350" rx="20"/>
      <text class="app-title" x="1147.5" y="722" text-anchor="middle">APP · AGENT SANDBOX</text>
      <g class="node sandbox-style">
        <rect x="820" y="445" width="170" height="235" rx="14"/>
        <text class="component-title" x="905" y="545">Sandbox Collie</text>
        <text class="component-copy" x="905" y="572">Pack peer</text>
        <text class="component-copy" x="905" y="595">No public UI</text>
      </g>
      <g id="herdr-runtime" class="herdr-runtime node sandbox-style">
        <rect x="1010" y="445" width="465" height="235" rx="14"/>
        <text class="herdr-title" x="1242.5" y="482" text-anchor="middle">HERDR</text>
        <text class="component-copy" x="1242.5" y="506">terminal multiplexer · process owner</text>
        <path class="process-link" d="M1242.5 520V538M1099 538H1386M1099 538V550M1242.5 538V550M1386 538V550"/>
        <g class="process purple-style">
          <rect x="1035" y="550" width="128" height="95" rx="10"/>
          <text class="component-title" x="1099" y="590">OpenCode</text>
          <text class="component-copy" x="1099" y="615">agent</text>
        </g>
        <g class="process purple-style">
          <rect x="1178" y="550" width="129" height="95" rx="10"/>
          <text class="component-title" x="1242.5" y="590">Shell</text>
          <text class="component-copy" x="1242.5" y="615">session</text>
        </g>
        <g class="process purple-style">
          <rect x="1322" y="550" width="128" height="95" rx="10"/>
          <text class="component-title" x="1386" y="590">Shell</text>
          <text class="component-copy" x="1386" y="615">+ CF CLI</text>
        </g>
      </g>
    </g>
  </g>

  <g id="cf-api" class="node cf-node">
    <rect class="cf-system-component cf-api-region" x="120" y="390" width="180" height="435" rx="14"/>
    <text class="system-title" x="210" y="555" text-anchor="middle">CF API</text>
    <text class="component-copy" x="210" y="585">Lifecycle control</text>
    <text class="component-copy" x="210" y="610">Outside Diego</text>
  </g>

  <g id="diego-region">
    <rect class="cf-system-component diego-region" x="330" y="770" width="1175" height="55" rx="14"/>
    <text class="system-title" x="917.5" y="805" text-anchor="middle">DIEGO</text>
  </g>

  <g id="connections-layer">
    <path id="pack-route" class="wide-route" marker-end="url(#wide-arrow)" d="M905 445V302.5H686.25V445"/>
    <circle class="route-endpoint" cx="905" cy="445" r="14"/>
    <path id="browser-route" class="wide-route" d="M420 181H642.5V445"/>
    <circle class="route-endpoint" cx="420" cy="181" r="14"/>
    <circle class="route-endpoint" cx="642.5" cy="445" r="14"/>
    <path id="manager-collie-route" class="wide-route" d="M598.75 445V417.5H491.25V445"/>
    <circle class="route-endpoint" cx="598.75" cy="445" r="14"/>
    <circle class="route-endpoint" cx="491.25" cy="445" r="14"/>
    <path id="sandbox-collie-herdr-route" class="wide-route" d="M947.5 445V417.5H1068.125V445"/>
    <circle class="route-endpoint" cx="947.5" cy="445" r="14"/>
    <circle class="route-endpoint" cx="1068.125" cy="445" r="14"/>
    <path id="terminal-herdr-route" class="wide-route" d="M1126.25 445V181H1205"/>
    <circle class="route-endpoint" cx="1126.25" cy="445" r="14"/>
    <circle class="route-endpoint" cx="1205" cy="181" r="14"/>
    <path id="manager-cf-api-route" class="wide-route" d="M447.5 445V302.5H210V390"/>
    <circle class="route-endpoint" cx="447.5" cy="445" r="14"/>
    <circle class="route-endpoint" cx="210" cy="390" r="14"/>
  </g>

  <g id="ingress-layer">
    <rect id="gorouter-cell" class="cf-system-component" x="120" y="265" width="870" height="75" rx="14"/>
    <rect id="ssh-proxy-cell" class="cf-system-component" x="1010" y="265" width="495" height="75" rx="14"/>
    <text class="system-title" x="555" y="309" text-anchor="middle">Gorouter</text>
    <text class="system-title" x="1257.5" y="309" text-anchor="middle">SSH Proxy</text>
  </g>
</svg>
