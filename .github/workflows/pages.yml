name: Deploy research map to Pages

on:
  push:
    branches: [main]
    paths:
      - "research/**"
      - "ideas/**"
      - "scripts/**"
      - "generated/**"
      - "tests/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/lint.yml"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "pyyaml==6.0.2"

      - name: Validate notes and ideas
        run: python .github/scripts/validate_notes.py

      - name: Check rating distributions
        run: python scripts/summarize_ratings.py --check

      - name: Test map generator
        run: python -m unittest discover -s tests

      - name: Generate research map
        run: python scripts/generate_research_map.py

      - name: Verify generated map is checked in
        run: git diff --exit-code -- generated/research-map.html

      - name: Create Pages site
        run: mkdir _site

      - name: Copy research map to site index
        run: cp generated/research-map.html _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
