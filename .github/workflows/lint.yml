name: Validate notes and ideas

on:
  pull_request:
    paths:
      - "research/**"
      - "ideas/**"
      - ".github/scripts/validate_notes.py"
      - "scripts/**"
      - "generated/**"
      - "tests/**"
      - ".github/workflows/lint.yml"
  push:
    branches: [main]
    paths:
      - "research/**"
      - "ideas/**"
      - ".github/scripts/validate_notes.py"
      - "scripts/**"
      - "generated/**"
      - "tests/**"
      - ".github/workflows/lint.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "pyyaml>=6"

      - name: Validate notes and ideas
        run: python .github/scripts/validate_notes.py

      - name: Check rating distributions
        run: python scripts/summarize_ratings.py --check

      - name: Test map generator
        run: python -m unittest discover -s tests

      - name: Check generated map
        run: python scripts/generate_research_map.py --check
